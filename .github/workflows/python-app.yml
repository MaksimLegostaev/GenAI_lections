name: Python application

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install qrcode pyzbar Pillow requests
        pip install python-decouple
        pip install -r 3_1_LLM_agent/requirements.txt
        sudo apt-get update
        sudo apt-get install -y libzbar0
    
    - name: Test with pytest
      working-directory: ./3_1_LLM_agent
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_qr_decoder.py -v --cov=llm_agent.qr_decoder_tool --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./3_1_LLM_agent/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false