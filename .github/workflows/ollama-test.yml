name: Ollama Integration Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ollama-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install qrcode pyzbar Pillow requests
        pip install python-decouple
        pip install -r 3_1_LLM_agent/requirements.txt
        sudo apt-get update
        sudo apt-get install -y libzbar0
    
    - name: Install Ollama
      uses: ai-action/setup-ollama@v1
    
    - name: Start Ollama server
      run: |
        ollama serve &
        sleep 5
    
    - name: Pull Ollama model
      run: |
        ollama pull qwen2.5:0.5b
    
    - name: Verify Ollama is running
      run: |
        curl http://localhost:11434/api/tags
    
    - name: Run tests with Ollama
      working-directory: ./3_1_LLM_agent
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/test_qr_decoder.py -v --cov=llm_agent.qr_decoder_tool --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./3_1_LLM_agent/coverage.xml
        flags: ollama
        name: ollama-coverage
        fail_ci_if_error: false